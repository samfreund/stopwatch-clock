<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch &amp; Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
    color: #000;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #stopwatch {
    font-size: 3rem;
  }
  #clock {
    font-size: 2rem;
    margin-top: 1rem;
  }
</style>
</head>
<body>
<div id="stopwatch">00:00:00.00</div>
<div id="clock">00:00:00</div>
<script>
  const stopwatchEl = document.getElementById('stopwatch');
  const clockEl = document.getElementById('clock');

  let startTime = null;
  let elapsed = 0;
  let raf = null;

  function now() { return performance.now(); }

  function stopwatchTime() {
    const total = elapsed + (startTime ? now() - startTime : 0);
    const ms = Math.floor(total);
    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const c = ms % 1000;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(Math.floor(c/10)).padStart(2,'0')}`;
  }

  function stopwatchTick() {
    stopwatchEl.textContent = stopwatchTime();
    raf = requestAnimationFrame(stopwatchTick);
  }

  function stopwatchRestart() {
    if (raf) cancelAnimationFrame(raf);
    startTime = now();
    elapsed = 0;
    stopwatchTick();
  }

  stopwatchRestart();

  window.addEventListener('keydown', (e) => {
    if (e.key === 'k') stopwatchRestart();
  });

  function clockTick() {
    const d = new Date();
    clockEl.textContent = d.toLocaleTimeString(undefined, {hour12: false});
    requestAnimationFrame(clockTick);
  }
  clockTick();
</script>
</body>
</html>
